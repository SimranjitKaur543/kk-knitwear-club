<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fabric Catalogue - K.K. Knitwear Club, Ludhiana</title>
<meta name="description" content="Search and filter 50 polyester and knitted fabric qualities by GSM, width, construction, finishing and application. Published prices and minimum order quantities.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f5750'/><text x='16' y='22' font-family='Arial' font-size='14' font-weight='bold' fill='%23fff' text-anchor='middle'>KK</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">

<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>

<main id="main">
    <div class="wrap">

        <div id="cat-crumbs"></div>

        <div class="section-head" style="margin-bottom:var(--s5)">
            <div>
                <p class="eyebrow">Fabric Catalogue</p>
                <h1 id="cat-title">Our Fabrics</h1>
                <p id="cat-desc">Every quality we manufacture, with the GSM, width,
                   composition, price and minimum order as published by the mill.</p>
            </div>
        </div>

        <noscript>
            <div class="note mb5">This catalogue needs JavaScript to search and filter.
            Please enable it, or call <strong>07942802251</strong> for our full
            product list.</div>
        </noscript>

        <!-- Search ------------------------------------------------------- -->
        <div class="searchbar" id="searchbar">
            <span class="icon" aria-hidden="true">&#9906;</span>
            <input id="search-input" type="text" autocomplete="off"
                   placeholder="Search fabric name, GSM, construction or application&hellip;"
                   aria-label="Search fabrics">
            <button class="clear" id="search-clear" type="button" aria-label="Clear search">&times;</button>
        </div>

        <div class="filters-mobile-bar">
            <button class="btn btn--outline" id="filters-open" type="button">
                Filters <span id="filter-count"></span>
            </button>
        </div>

        <!-- Filters + grid ----------------------------------------------- -->
        <div class="catalog">

            <aside class="filters" id="filters" aria-label="Filter fabrics">
                <div class="filters-head">
                    <h2>Filters</h2>
                    <button class="btn btn--quiet btn--sm" type="button" data-clear-all>Clear all</button>
                </div>
                <div class="filters-body" id="filters-body"></div>
                <div class="filters-foot">
                    <button class="btn btn--outline" type="button" data-filters-close>Close</button>
                    <button class="btn btn--primary" type="button" data-filters-close>Show results</button>
                </div>
            </aside>

            <div>
                <div class="toolbar">
                    <p class="result-count" id="result-count" aria-live="polite"></p>
                    <div class="toolbar-right">
                        <div class="sort-wrap">
                            <label for="sort-select">Sort by</label>
                            <select class="select" id="sort-select"></select>
                        </div>
                    </div>
                </div>

                <div class="active-filters hidden" id="active-filters"></div>
                <div id="product-grid" class="grid-products"></div>
            </div>

        </div>
    </div>

    <div class="compare-tray" id="compare-tray"></div>
</main>

<footer id="site-footer"></footer>

<script src="js/products.js"></script>
<script src="js/normalize.js"></script>
<script src="js/store.js"></script>
<script src="js/motion.js"></script>
<script src="js/ui.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
